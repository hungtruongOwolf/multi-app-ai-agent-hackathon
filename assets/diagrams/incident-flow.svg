  </marker>
</defs><rect width="1260" height="1200" rx="24" fill="#f5f7fb"/><text x="50" y="64" font-size="32" fill="#0e1a33" font-weight="800" text-anchor="start" >How an incident flows</text><text x="50" y="98" font-size="18" fill="#5b6478" font-weight="400" text-anchor="start" >One incident, end to end. The LLM proposes, code decides, people stay in charge.</text><circle cx="700" cy="58" r="7" fill="#6f78f2"/><text x="714" y="64" font-size="16" fill="#0e1a33" font-weight="600" text-anchor="start" >LLM (Claude)</text><circle cx="855" cy="58" r="7" fill="#1a74ee"/><text x="869" y="64" font-size="16" fill="#0e1a33" font-weight="600" text-anchor="start" >Code</text><circle cx="936" cy="58" r="7" fill="#0fa89b"/><text x="950" y="64" font-size="16" fill="#0e1a33" font-weight="600" text-anchor="start" >Human</text><circle cx="1026" cy="58" r="7" fill="#64748b"/><text x="1040" y="64" font-size="16" fill="#0e1a33" font-weight="600" text-anchor="start" >Connected app</text><path d="M394 290.0 H454" fill="none" stroke="#8a94a8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M804 290.0 H864" fill="none" stroke="#8a94a8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1040.0 434 V504" fill="none" stroke="#8a94a8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M866 630 H806" fill="none" stroke="#8a94a8" stroke-width="2.5" marker-end="url(#arrow)"/><text x="835.0" y="616" font-size="14" fill="#5b6478" font-weight="700" text-anchor="middle" >approval</text><path d="M456 630 H396" fill="none" stroke="#0fa89b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="425.0" y="616" font-size="14" fill="#0fa89b" font-weight="700" text-anchor="middle" >approved</text><path d="M980 794 V828 H300 V798" fill="none" stroke="#1a74ee" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-brand)"/><rect x="429.0" y="820" width="362" height="24" rx="6" fill="#f5f7fb"/><text x="610.0" y="834" font-size="14" fill="#1a74ee" font-weight="600" text-anchor="middle" >earned autonomy L2 / L3: runs without a click</text><path d="M130 794 V864" fill="none" stroke="#8a94a8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M394 1020 H454" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/><text x="425.0" y="1006" font-size="14" fill="#16a34a" font-weight="700" text-anchor="middle" >recovered</text><path d="M804 1010.0 H864" fill="none" stroke="#8a94a8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1214 1010.0 H1244 V230 H1218" fill="none" stroke="#6f78f2" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="1230" y="620.0" font-size="15" fill="#6f78f2" font-weight="700" text-anchor="middle" transform="rotate(-90 1230 620.0)" dy="-4">next incident uses what was learned</text><g filter="url(#shadow)"><rect x="50" y="150" width="340" height="280" rx="16" fill="#ffffff" stroke="#d9dfeb"/></g><rect x="50" y="150" width="340" height="6" rx="3" fill="#64748b"/><circle cx="86" cy="190" r="17" fill="#64748b"/><text x="86" y="196.5" font-size="17" fill="#fff" font-weight="700" text-anchor="middle" >1</text><text x="114" y="197" font-size="21" fill="#0e1a33" font-weight="700" text-anchor="start" >Something breaks</text><rect x="324" y="177" width="50" height="25" rx="12.5" fill="#eef1f5"/><text x="349.0" y="194.5" font-size="13" fill="#64748b" font-weight="700" text-anchor="middle" letter-spacing="1">APPS</text><rect x="70" y="226" width="136" height="30" rx="15.0" fill="#eef1f5" stroke="#64748b" stroke-opacity="0.35"/><text x="138.0" y="246.76" font-size="16" fill="#64748b" font-weight="600" text-anchor="middle" >Sentry errors</text><rect x="214" y="226" width="92" height="30" rx="15.0" fill="#eef1f5" stroke="#64748b" stroke-opacity="0.35"/><text x="260.0" y="246.76" font-size="16" fill="#64748b" font-weight="600" text-anchor="middle" >SLO burn</text><rect x="70" y="264" width="110" height="30" rx="15.0" fill="#eef1f5" stroke="#64748b" stroke-opacity="0.35"/><text x="125.0" y="284.76" font-size="16" fill="#64748b" font-weight="600" text-anchor="middle" >Change log</text><text x="70" y="330.0" font-size="17" fill="#5b6478" font-weight="400" text-anchor="start" >Errors and live metrics from</text><text x="70" y="354.14" font-size="17" fill="#5b6478" font-weight="400" text-anchor="start" >ShopLab. A short settle window</text><text x="70" y="378.28" font-size="17" fill="#5b6478" font-weight="400" text-anchor="start" >so one stray error is not</text><text x="70" y="402.42" font-size="17" fill="#5b6478" font-weight="400" text-anchor="start" >an incident.</text><g filter="url(#shadow)"><rect x="460" y="150" width="340" height="280" rx="16" fill="#ffffff" stroke="#d9dfeb"/></g><rect x="460" y="150" width="340" height="6" rx="3" fill="#6f78f2"/><circle cx="496" cy="190" r="17" fill="#6f78f2"/><text x="496" y="196.5" font-size="17" fill="#fff" font-weight="700" text-anchor="middle" >2</text><text x="524" y="197" font-size="21" fill="#0e1a33" font-weight="700" text-anchor="start" >Judge it</text><rect x="741" y="177" width="43" height="25" rx="12.5" fill="#eff0fe"/><text x="762.5" y="194.5" font-size="13" fill="#6f78f2" font-weight="700" text-anchor="middle" letter-spacing="1">LLM</text><circle cx="486" cy="242.39" r="6" fill="#6f78f2"/><text x="500" y="248" font-size="17" fill="#0e1a33" font-weight="400" text-anchor="start" >How severe? SEV1 to SEV4</text><circle cx="486" cy="276.39" r="6" fill="#6f78f2"/><text x="500" y="282" font-size="17" fill="#0e1a33" font-weight="400" text-anchor="start" >Can customers see it?</text><circle cx="486" cy="310.39" r="6" fill="#6f78f2"/><text x="500" y="316" font-size="17" fill="#0e1a33" font-weight="400" text-anchor="start" >Same cause as an open one?</text><text x="480" y="346" font-size="15" fill="#5b6478" font-weight="600" text-anchor="start" >Opens exactly</text><rect x="480" y="358" width="154" height="30" rx="15.0" fill="#eef1f5" stroke="#64748b" stroke-opacity="0.35"/><text x="557.0" y="378.76" font-size="16" fill="#64748b" font-weight="600" text-anchor="middle" >1 Linear ticket</text><rect x="480" y="396" width="145" height="30" rx="15.0" fill="#eef1f5" stroke="#64748b" stroke-opacity="0.35"/><text x="552.5" y="416.76" font-size="16" fill="#64748b" font-weight="600" text-anchor="middle" >1 Slack thread</text><g filter="url(#shadow)"><rect x="870" y="150" width="340" height="280" rx="16" fill="#ffffff" stroke="#d9dfeb"/></g><rect x="870" y="150" width="340" height="6" rx="3" fill="url(#mixed)"/><circle cx="906" cy="190" r="17" fill="#1a74ee"/><text x="906" y="196.5" font-size="17" fill="#fff" font-weight="700" text-anchor="middle" >3</text><text x="934" y="197" font-size="21" fill="#0e1a33" font-weight="700" text-anchor="start" >Fixed this before?</text><rect x="888" y="220" width="304" height="92" rx="12" fill="#eaf2fe"/><text x="904" y="248" font-size="18" fill="#1a74ee" font-weight="700" text-anchor="start" >Yes: runbook</text><text x="904" y="273" font-size="16" fill="#0e1a33" font-weight="400" text-anchor="start" >Code checks its conditions on</text><text x="904" y="295" font-size="16" fill="#0e1a33" font-weight="400" text-anchor="start" >live metrics. Autonomy L0 to L3.</text><rect x="888" y="322" width="304" height="92" rx="12" fill="#eff0fe"/><text x="904" y="350" font-size="18" fill="#6f78f2" font-weight="700" text-anchor="start" >No, or a look-alike: diagnose</text><text x="904" y="375" font-size="16" fill="#0e1a33" font-weight="400" text-anchor="start" >Service docs, change log and</text><text x="904" y="397" font-size="16" fill="#0e1a33" font-weight="400" text-anchor="start" >metrics, with cited evidence.</text><g filter="url(#shadow)"><rect x="870" y="510" width="340" height="280" rx="16" fill="#ffffff" stroke="#d9dfeb"/></g><rect x="870" y="510" width="340" height="6" rx="3" fill="#1a74ee"/><circle cx="906" cy="550" r="17" fill="#1a74ee"/><text x="906" y="556.5" font-size="17" fill="#fff" font-weight="700" text-anchor="middle" >4</text><text x="934" y="557" font-size="21" fill="#0e1a33" font-weight="700" text-anchor="start" >Policy engine</text><rect x="1144" y="537" width="50" height="25" rx="12.5" fill="#eaf2fe"/><text x="1169.0" y="554.5" font-size="13" fill="#1a74ee" font-weight="700" text-anchor="middle" letter-spacing="1">CODE</text><text x="890" y="602.0" font-size="17" fill="#5b6478" font-weight="400" text-anchor="start" >Rules P1 to P15, pure code.</text><text x="890" y="626.14" font-size="17" fill="#5b6478" font-weight="400" text-anchor="start" >Every decision is audited.</text><rect x="890" y="660" width="70" height="28" rx="8" fill="#e8f6ec"/><text x="925.0" y="679" font-size="14" fill="#16a34a" font-weight="800" text-anchor="middle" letter-spacing="0.6">ALLOW</text><text x="970" y="680" font-size="17" fill="#0e1a33" font-weight="400" text-anchor="start" >earned: execute</text><rect x="890" y="700" width="93" height="28" rx="8" fill="#fdf3e3"/><text x="936.5" y="719" font-size="14" fill="#d97706" font-weight="800" text-anchor="middle" letter-spacing="0.6">APPROVAL</text><text x="993" y="720" font-size="17" fill="#0e1a33" font-weight="400" text-anchor="start" >ask on-call</text><rect x="890" y="740" width="62" height="28" rx="8" fill="#fdecec"/><text x="921.0" y="759" font-size="14" fill="#dc2626" font-weight="800" text-anchor="middle" letter-spacing="0.6">DENY</text><text x="962" y="760" font-size="17" fill="#0e1a33" font-weight="400" text-anchor="start" >explain + page</text><g filter="url(#shadow)"><rect x="460" y="510" width="340" height="280" rx="16" fill="#ffffff" stroke="#d9dfeb"/></g><rect x="460" y="510" width="340" height="6" rx="3" fill="#0fa89b"/><circle cx="496" cy="550" r="17" fill="#0fa89b"/><text x="496" y="556.5" font-size="17" fill="#fff" font-weight="700" text-anchor="middle" >5</text><text x="524" y="557" font-size="21" fill="#0e1a33" font-weight="700" text-anchor="start" >One card in Slack</text><rect x="727" y="537" width="57" height="25" rx="12.5" fill="#e6f7f5"/><text x="755.5" y="554.5" font-size="13" fill="#0fa89b" font-weight="700" text-anchor="middle" letter-spacing="1">HUMAN</text><text x="480" y="602.0" font-size="17" fill="#5b6478" font-weight="400" text-anchor="start" >Exact change, why, how it is</text><text x="480" y="626.14" font-size="17" fill="#5b6478" font-weight="400" text-anchor="start" >verified, how it rolls back.</text><rect x="480" y="652" width="118" height="30" rx="15.0" fill="#e6f7f5" stroke="#0fa89b" stroke-opacity="0.35"/><text x="539.0" y="672.76" font-size="16" fill="#0fa89b" font-weight="600" text-anchor="middle" >Approve all</text><rect x="606" y="652" width="92" height="30" rx="15.0" fill="#e6f7f5" stroke="#0fa89b" stroke-opacity="0.35"/><text x="652.0" y="672.76" font-size="16" fill="#0fa89b" font-weight="600" text-anchor="middle" >Fix only</text><rect x="480" y="690" width="101" height="30" rx="15.0" fill="#e6f7f5" stroke="#0fa89b" stroke-opacity="0.35"/><text x="530.5" y="710.76" font-size="16" fill="#0fa89b" font-weight="600" text-anchor="middle" >Post only</text><rect x="589" y="690" width="74" height="30" rx="15.0" fill="#e6f7f5" stroke="#0fa89b" stroke-opacity="0.35"/><text x="626.0" y="710.76" font-size="16" fill="#0fa89b" font-weight="600" text-anchor="middle" >Reject</text><text x="480" y="752" font-size="16" fill="#5b6478" font-weight="400" text-anchor="start" >No answer in time: nothing</text><text x="480" y="774" font-size="16" fill="#5b6478" font-weight="400" text-anchor="start" >runs, PagerDuty pages on-call.</text><g filter="url(#shadow)"><rect x="50" y="510" width="340" height="280" rx="16" fill="#ffffff" stroke="#d9dfeb"/></g><rect x="50" y="510" width="340" height="6" rx="3" fill="#1a74ee"/><circle cx="86" cy="550" r="17" fill="#1a74ee"/><text x="86" y="556.5" font-size="17" fill="#fff" font-weight="700" text-anchor="middle" >6</text><text x="114" y="557" font-size="21" fill="#0e1a33" font-weight="700" text-anchor="start" >Act, exactly once</text><rect x="324" y="537" width="50" height="25" rx="12.5" fill="#eaf2fe"/><text x="349.0" y="554.5" font-size="13" fill="#1a74ee" font-weight="700" text-anchor="middle" letter-spacing="1">CODE</text><text x="70" y="602.0" font-size="17" fill="#5b6478" font-weight="400" text-anchor="start" >Catalog action through the</text><text x="70" y="626.14" font-size="17" fill="#5b6478" font-weight="400" text-anchor="start" >ShopLab control API. Only the</text><text x="70" y="650.28" font-size="17" fill="#5b6478" font-weight="400" text-anchor="start" >executor holds credentials.</text><rect x="70" y="706" width="118" height="30" rx="15.0" fill="#eef1f5" stroke="#64748b" stroke-opacity="0.35"/><text x="129.0" y="726.76" font-size="16" fill="#64748b" font-weight="600" text-anchor="middle" >Status page</text><rect x="196" y="706" width="118" height="30" rx="15.0" fill="#eef1f5" stroke="#64748b" stroke-opacity="0.35"/><text x="255.0" y="726.76" font-size="16" fill="#64748b" font-weight="600" text-anchor="middle" >Linear note</text><rect x="70" y="744" width="83" height="30" rx="15.0" fill="#eef1f5" stroke="#64748b" stroke-opacity="0.35"/><text x="111.5" y="764.76" font-size="16" fill="#64748b" font-weight="600" text-anchor="middle" >ShopLab</text><g filter="url(#shadow)"><rect x="50" y="870" width="340" height="280" rx="16" fill="#ffffff" stroke="#d9dfeb"/></g><rect x="50" y="870" width="340" height="6" rx="3" fill="#1a74ee"/><circle cx="86" cy="910" r="17" fill="#1a74ee"/><text x="86" y="916.5" font-size="17" fill="#fff" font-weight="700" text-anchor="middle" >7</text><text x="114" y="917" font-size="21" fill="#0e1a33" font-weight="700" text-anchor="start" >Verify on live SLOs</text><rect x="324" y="897" width="50" height="25" rx="12.5" fill="#eaf2fe"/><text x="349.0" y="914.5" font-size="13" fill="#1a74ee" font-weight="700" text-anchor="middle" letter-spacing="1">CODE</text><text x="70" y="962.0" font-size="17" fill="#5b6478" font-weight="400" text-anchor="start" >Error rate on real traffic,</text><text x="70" y="986.14" font-size="17" fill="#5b6478" font-weight="400" text-anchor="start" >for example 100% to 0%.</text><rect x="70" y="998" width="300" height="40" rx="10" fill="#e8f6ec"/><text x="86" y="1024" font-size="17" fill="#16a34a" font-weight="700" text-anchor="start" >Recovered: resolve</text><rect x="70" y="1048" width="300" height="76" rx="10" fill="#fdecec"/><text x="86" y="1074" font-size="17" fill="#dc2626" font-weight="700" text-anchor="start" >Not recovered:</text><text x="86" y="1102" font-size="17" fill="#0e1a33" font-weight="400" text-anchor="start" >roll back, demote, page</text><g filter="url(#shadow)"><rect x="460" y="870" width="340" height="280" rx="16" fill="#ffffff" stroke="#d9dfeb"/></g><rect x="460" y="870" width="340" height="6" rx="3" fill="#1a74ee"/><circle cx="496" cy="910" r="17" fill="#1a74ee"/><text x="496" y="916.5" font-size="17" fill="#fff" font-weight="700" text-anchor="middle" >8</text><text x="524" y="917" font-size="21" fill="#0e1a33" font-weight="700" text-anchor="start" >Resolve everywhere</text><rect x="734" y="897" width="50" height="25" rx="12.5" fill="#eaf2fe"/><text x="759.0" y="914.5" font-size="13" fill="#1a74ee" font-weight="700" text-anchor="middle" letter-spacing="1">CODE</text><text x="480" y="962.0" font-size="17" fill="#5b6478" font-weight="400" text-anchor="start" >Only after a quiet window with</text><text x="480" y="986.14" font-size="17" fill="#5b6478" font-weight="400" text-anchor="start" >healthy SLOs (P4).</text><rect x="480" y="1006" width="118" height="30" rx="15.0" fill="#eef1f5" stroke="#64748b" stroke-opacity="0.35"/><text x="539.0" y="1026.76" font-size="16" fill="#64748b" font-weight="600" text-anchor="middle" >Status page</text><rect x="606" y="1006" width="118" height="30" rx="15.0" fill="#eef1f5" stroke="#64748b" stroke-opacity="0.35"/><text x="665.0" y="1026.76" font-size="16" fill="#64748b" font-weight="600" text-anchor="middle" >Linear done</text><rect x="480" y="1044" width="74" height="30" rx="15.0" fill="#eef1f5" stroke="#64748b" stroke-opacity="0.35"/><text x="517.0" y="1064.76" font-size="16" fill="#64748b" font-weight="600" text-anchor="middle" >Sentry</text><rect x="562" y="1044" width="101" height="30" rx="15.0" fill="#eef1f5" stroke="#64748b" stroke-opacity="0.35"/><text x="612.5" y="1064.76" font-size="16" fill="#64748b" font-weight="600" text-anchor="middle" >PagerDuty</text><text x="480" y="1108" font-size="16" fill="#5b6478" font-weight="400" text-anchor="start" >Report posted to the thread.</text><g filter="url(#shadow)"><rect x="870" y="870" width="340" height="280" rx="16" fill="#ffffff" stroke="#d9dfeb"/></g><rect x="870" y="870" width="340" height="6" rx="3" fill="url(#mixed)"/><circle cx="906" cy="910" r="17" fill="#1a74ee"/><text x="906" y="916.5" font-size="17" fill="#fff" font-weight="700" text-anchor="middle" >9</text><text x="934" y="917" font-size="21" fill="#0e1a33" font-weight="700" text-anchor="start" >Learn</text><circle cx="897" cy="960" r="7" fill="#1a74ee"/><text x="912" y="966" font-size="17" fill="#1a74ee" font-weight="700" text-anchor="start" >Code</text><text x="912" y="987" font-size="15" fill="#5b6478" font-weight="400" text-anchor="start" >writes timeline, stats, autonomy</text><circle cx="897" cy="1004" r="7" fill="#6f78f2"/><text x="912" y="1010" font-size="17" fill="#6f78f2" font-weight="700" text-anchor="start" >Claude</text><text x="912" y="1031" font-size="15" fill="#5b6478" font-weight="400" text-anchor="start" >drafts the runbook update</text><circle cx="897" cy="1048" r="7" fill="#64748b"/><text x="912" y="1054" font-size="17" fill="#64748b" font-weight="700" text-anchor="start" >GitHub</text><text x="912" y="1075" font-size="15" fill="#5b6478" font-weight="400" text-anchor="start" >pull request on knowledge/</text><circle cx="897" cy="1092" r="7" fill="#0fa89b"/><text x="912" y="1098" font-size="17" fill="#0fa89b" font-weight="700" text-anchor="start" >Human</text><text x="912" y="1119" font-size="15" fill="#5b6478" font-weight="400" text-anchor="start" >merges it, in GitHub or Slack</text></svg>