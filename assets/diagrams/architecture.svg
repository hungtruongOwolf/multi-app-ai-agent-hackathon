</defs><rect width="1260" height="1040" rx="24" fill="#f5f7fb"/><text x="50" y="64" font-size="32" fill="#0e1a33" font-weight="800" text-anchor="start" >Architecture</text><text x="50" y="98" font-size="18" fill="#5b6478" font-weight="400" text-anchor="start" >The model never holds a credential: it proposes, the policy engine decides, the executor acts.</text><path d="M190 466 V416" fill="none" stroke="#8a94a8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="194.5" y="432" width="131" height="24" rx="6" fill="#f5f7fb"/><text x="260" y="446" font-size="14" fill="#5b6478" font-weight="600" text-anchor="middle" >errors, metrics</text><path d="M884 640 H935" fill="none" stroke="#1a74ee" stroke-width="2.5"/><path d="M935 196 V596" fill="none" stroke="#1a74ee" stroke-width="2.5"/><path d="M935 196 H949" fill="none" stroke="#1a74ee" stroke-width="2.5" marker-end="url(#arrow-brand)"/><path d="M935 296 H949" fill="none" stroke="#1a74ee" stroke-width="2.5" marker-end="url(#arrow-brand)"/><path d="M935 396 H949" fill="none" stroke="#1a74ee" stroke-width="2.5" marker-end="url(#arrow-brand)"/><path d="M935 496 H949" fill="none" stroke="#1a74ee" stroke-width="2.5" marker-end="url(#arrow-brand)"/><path d="M935 596 H949" fill="none" stroke="#1a74ee" stroke-width="2.5" marker-end="url(#arrow-brand)"/><path d="M935 596 V640" fill="none" stroke="#1a74ee" stroke-width="2.5"/><path d="M1087.5 644 V684" fill="none" stroke="#6f78f2" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M650.0 896 V846" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="40" y="150" width="280" height="260" rx="14" fill="#fff" stroke="#d9dfeb"/></g><rect x="40" y="164" width="5" height="232" rx="2.5" fill="#64748b"/><text x="60" y="182" font-size="18" fill="#0e1a33" font-weight="700" text-anchor="start" >Signals</text><rect x="273" y="164" width="35" height="23" rx="11.5" fill="#eef1f5"/><text x="290.5" y="180" font-size="12" fill="#64748b" font-weight="700" text-anchor="middle" letter-spacing="1">IN</text><rect x="60" y="200" width="74" height="30" rx="15.0" fill="#eef1f5" stroke="#64748b" stroke-opacity="0.35"/><text x="97.0" y="220.76" font-size="16" fill="#64748b" font-weight="600" text-anchor="middle" >Sentry</text><text x="60" y="256" font-size="15" fill="#5b6478" font-weight="400" text-anchor="start" >issues and latest events from</text><text x="60" y="277" font-size="15" fill="#5b6478" font-weight="400" text-anchor="start" >production and staging</text><rect x="60" y="300" width="110" height="30" rx="15.0" fill="#eef1f5" stroke="#64748b" stroke-opacity="0.35"/><text x="115.0" y="320.76" font-size="16" fill="#64748b" font-weight="600" text-anchor="middle" >SLO poller</text><text x="60" y="356" font-size="15" fill="#5b6478" font-weight="400" text-anchor="start" >error rate, latency, pool and</text><text x="60" y="377" font-size="15" fill="#5b6478" font-weight="400" text-anchor="start" >query metrics, burn rates</text><g filter="url(#shadow)"><rect x="40" y="470" width="280" height="370" rx="14" fill="#fff" stroke="#d9dfeb"/></g><rect x="40" y="484" width="5" height="342" rx="2.5" fill="#64748b"/><text x="60" y="502" font-size="18" fill="#0e1a33" font-weight="700" text-anchor="start" >ShopLab</text><rect x="247" y="484" width="61" height="23" rx="11.5" fill="#eef1f5"/><text x="277.5" y="500" font-size="12" fill="#64748b" font-weight="700" text-anchor="middle" letter-spacing="1">TARGET</text><rect x="60" y="518" width="104" height="29" rx="14.5" fill="#eef1f5" stroke="#64748b" stroke-opacity="0.35"/><text x="112.0" y="537.9" font-size="15" fill="#64748b" font-weight="600" text-anchor="middle" >Storefront</text><rect x="60" y="555" width="162" height="29" rx="14.5" fill="#eef1f5" stroke="#64748b" stroke-opacity="0.35"/><text x="141.0" y="574.9" font-size="15" fill="#64748b" font-weight="600" text-anchor="middle" >/ops control room</text><text x="60" y="618" font-size="15" fill="#5b6478" font-weight="400" text-anchor="start" >checkout, search, catalog,</text><text x="60" y="639" font-size="15" fill="#5b6478" font-weight="400" text-anchor="start" >internal-batch, staging copy</text><text x="60" y="660" font-size="15" fill="#5b6478" font-weight="400" text-anchor="start" ></text><text x="60" y="681" font-size="15" fill="#5b6478" font-weight="400" text-anchor="start" >Real connection pool, traffic,</text><text x="60" y="702" font-size="15" fill="#5b6478" font-weight="400" text-anchor="start" >Prometheus metrics, sentry-sdk</text><text x="60" y="723" font-size="15" fill="#5b6478" font-weight="400" text-anchor="start" ></text><text x="60" y="744" font-size="15" fill="#5b6478" font-weight="400" text-anchor="start" >Control API, change log,</text><text x="60" y="765" font-size="15" fill="#5b6478" font-weight="400" text-anchor="start" >fault injector</text><g filter="url(#shadow)"><rect x="400" y="140" width="500" height="700" rx="22" fill="#ffffff" stroke="#d9dfeb"/></g><path d="M400 162 a22 22 0 0 1 22 -22 h456 a22 22 0 0 1 22 22 v18 h-500 z" fill="url(#brand)"/><text x="424" y="169" font-size="19" fill="#ffffff" font-weight="800" text-anchor="start" >Incident Judge</text><text x="876" y="169" font-size="14" fill="#dbe7ff" font-weight="600" text-anchor="end" >Python 3.12 · FastAPI · SQLite</text><rect x="420" y="198" width="460" height="80" rx="12" fill="#eaf2fe"/><text x="438" y="228" font-size="18" fill="#1a74ee" font-weight="700" text-anchor="start" >Per-incident state machine</text><text x="438" y="256" font-size="15" fill="#0e1a33" font-weight="400" text-anchor="start" >SQLite outbox: resumable after a crash, every write exactly once</text><path d="M530.0 280 V312" fill="none" stroke="#8a94a8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="420" y="318" width="212.0" height="190" rx="12" fill="#eff0fe"/><text x="436" y="348" font-size="18" fill="#6f78f2" font-weight="700" text-anchor="start" >Reasoning</text><text x="436" y="370" font-size="14" fill="#6f78f2" font-weight="600" text-anchor="start" >Claude, JSON only</text><text x="436" y="400" font-size="15" fill="#0e1a33" font-weight="400" text-anchor="start" >Triage judge</text><text x="436" y="424" font-size="15" fill="#0e1a33" font-weight="400" text-anchor="start" >Diagnosis</text><text x="436" y="448" font-size="15" fill="#0e1a33" font-weight="400" text-anchor="start" >Discussion in Slack</text><text x="436" y="472" font-size="15" fill="#0e1a33" font-weight="400" text-anchor="start" >Runbook writer</text><rect x="668.0" y="318" width="212.0" height="190" rx="12" fill="#f1f4f9"/><text x="684.0" y="348" font-size="18" fill="#0e1a33" font-weight="700" text-anchor="start" >Memory</text><text x="684.0" y="370" font-size="14" fill="#5b6478" font-weight="600" text-anchor="start" >LLM Wiki in git</text><text x="684.0" y="400" font-size="15" fill="#0e1a33" font-weight="400" text-anchor="start" >Service docs, runbooks</text><text x="684.0" y="424" font-size="15" fill="#0e1a33" font-weight="400" text-anchor="start" >Proposal validator</text><text x="684.0" y="448" font-size="15" fill="#0e1a33" font-weight="400" text-anchor="start" >Code-owned stats</text><text x="684.0" y="472" font-size="15" fill="#0e1a33" font-weight="400" text-anchor="start" >GitHub mirror</text><path d="M634.0 440 H666.0" fill="none" stroke="#8a94a8" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="414" y="548" width="472" height="276" rx="14" fill="none" stroke="#1a74ee" stroke-width="2" stroke-dasharray="8 6"/><rect x="714.0" y="533" width="120" height="30" rx="15" fill="#1a74ee"/><text x="774.0" y="553" font-size="14" fill="#fff" font-weight="700" text-anchor="middle" >code decides</text><path d="M526.0 510 V584" fill="none" stroke="#6f78f2" stroke-width="2.5" marker-end="url(#arrow)"/><text x="540.0" y="535" font-size="14" fill="#6f78f2" font-weight="700" text-anchor="start" >proposes, no credentials</text><rect x="428" y="590" width="204.0" height="110" rx="12" fill="#eaf2fe"/><text x="444" y="620" font-size="18" fill="#1a74ee" font-weight="700" text-anchor="start" >Policy engine</text><text x="444" y="646" font-size="15" fill="#0e1a33" font-weight="400" text-anchor="start" >P1 to P15, pure code</text><text x="444" y="668" font-size="15" fill="#0e1a33" font-weight="400" text-anchor="start" >every decision audited</text><rect x="668.0" y="590" width="204.0" height="110" rx="12" fill="#eaf2fe"/><text x="684.0" y="620" font-size="18" fill="#1a74ee" font-weight="700" text-anchor="start" >Executor</text><text x="684.0" y="646" font-size="15" fill="#0e1a33" font-weight="400" text-anchor="start" >only credential holder</text><text x="684.0" y="668" font-size="15" fill="#0e1a33" font-weight="400" text-anchor="start" >catalog actions only</text><path d="M634.0 645 H662.0" fill="none" stroke="#1a74ee" stroke-width="2.5" marker-end="url(#arrow-brand)"/><rect x="428" y="716" width="444" height="92" rx="12" fill="#e8f6ec"/><text x="444" y="746" font-size="18" fill="#16a34a" font-weight="700" text-anchor="start" >Verifier + rollback</text><text x="444" y="772" font-size="15" fill="#0e1a33" font-weight="400" text-anchor="start" >SLOs on live traffic after every change; failure rolls back</text><text x="444" y="793" font-size="15" fill="#0e1a33" font-weight="400" text-anchor="start" >and demotes the runbook; approvals bound to a plan hash</text><text x="955" y="132" font-size="13" fill="#5b6478" font-weight="700" text-anchor="start" letter-spacing="1.5">CONNECTED APPS</text><g filter="url(#shadow)"><rect x="955" y="150" width="265" height="84" rx="14" fill="#fff" stroke="#d9dfeb"/></g><rect x="955" y="164" width="5" height="56" rx="2.5" fill="#0fa89b"/><text x="975" y="182" font-size="18" fill="#0e1a33" font-weight="700" text-anchor="start" >Slack</text><text x="975" y="208" font-size="15" fill="#5b6478" font-weight="400" text-anchor="start" >Thread, buttons (Socket Mode)</text><g filter="url(#shadow)"><rect x="955" y="250" width="265" height="84" rx="14" fill="#fff" stroke="#d9dfeb"/></g><rect x="955" y="264" width="5" height="56" rx="2.5" fill="#64748b"/><text x="975" y="282" font-size="18" fill="#0e1a33" font-weight="700" text-anchor="start" >Linear</text><text x="975" y="308" font-size="15" fill="#5b6478" font-weight="400" text-anchor="start" >One ticket per incident</text><g filter="url(#shadow)"><rect x="955" y="350" width="265" height="84" rx="14" fill="#fff" stroke="#d9dfeb"/></g><rect x="955" y="364" width="5" height="56" rx="2.5" fill="#64748b"/><text x="975" y="382" font-size="18" fill="#0e1a33" font-weight="700" text-anchor="start" >Instatus</text><text x="975" y="408" font-size="15" fill="#5b6478" font-weight="400" text-anchor="start" >Public status page, templates</text><g filter="url(#shadow)"><rect x="955" y="450" width="265" height="84" rx="14" fill="#fff" stroke="#d9dfeb"/></g><rect x="955" y="464" width="5" height="56" rx="2.5" fill="#dc2626"/><text x="975" y="482" font-size="18" fill="#0e1a33" font-weight="700" text-anchor="start" >PagerDuty</text><text x="975" y="508" font-size="15" fill="#5b6478" font-weight="400" text-anchor="start" >Pages on-call, auto-resolves</text><g filter="url(#shadow)"><rect x="955" y="550" width="265" height="84" rx="14" fill="#fff" stroke="#d9dfeb"/></g><rect x="955" y="564" width="5" height="56" rx="2.5" fill="#0e1a33"/><text x="975" y="582" font-size="18" fill="#0e1a33" font-weight="700" text-anchor="start" >GitHub</text><text x="975" y="608" font-size="15" fill="#5b6478" font-weight="400" text-anchor="start" >Runbook pull requests</text><g filter="url(#shadow)"><rect x="955" y="690" width="265" height="150" rx="14" fill="#fff" stroke="#d9dfeb"/></g><rect x="955" y="704" width="5" height="122" rx="2.5" fill="#6f78f2"/><text x="975" y="722" font-size="18" fill="#0e1a33" font-weight="700" text-anchor="start" >knowledge/</text><rect x="1160" y="704" width="48" height="23" rx="11.5" fill="#eff0fe"/><text x="1184.0" y=