  - {when: public_post_requested, actor: oncall_1, reply: approve}
wait: {min_runtime_s: 90, settle_s: 30}
timeout_s: 260
expect:
  incidents: {count: 1}
  linear: {count: 1, priority: 1}
  decisions_contains:
    - {intent: remediation.execute, result: DENY, rules: [P7]}
