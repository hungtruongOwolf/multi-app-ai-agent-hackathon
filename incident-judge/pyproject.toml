[project]
name = "incident-judge"
version = "0.1.0"
description = "On-call agent: judges incidents, acts across apps, learns runbooks (LLM Wiki), earns autonomy."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "prometheus-client>=0.20",
  "sentry-sdk>=2.0",
  "anthropic>=0.40",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.32",
  "slack-bolt>=1.20",
  "aiohttp>=3.9",
  "shoplab",
]

[project.optional-dependencies]
slack = ["slack-bolt>=1.20"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.uv.sources]
shoplab = { workspace = true }

[project.scripts]
judge = "judge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["judge", "sandbox", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
